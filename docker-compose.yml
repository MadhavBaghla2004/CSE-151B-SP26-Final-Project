services:
  notebook:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace                          # live edits sync instantly
      - hf_cache:/root/.cache/huggingface     # model cache persists between runs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - TRANSFORMERS_CACHE=/root/.cache/huggingface

volumes:
  hf_cache:
